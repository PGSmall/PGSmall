name: Generate Snake and Combined Badges

on:
  schedule:
    - cron: "0 0 * * *" # 每天 UTC 0 点自动刷新
  workflow_dispatch: # 支持手动点击运行

# 声明写入权限
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. 生成贪吃蛇 SVG
      - name: Generate Snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: PGSmall
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 2. 合并计算多仓库 Stars 并生成 JSON 徽章
      - name: Calculate Combined Stars
        run: |
          mkdir -p dist/badges
          python3 - << 'EOF'
          import os, json, urllib.request

          token = os.environ.get('GITHUB_TOKEN')
          headers = {
              'User-Agent': 'Mozilla/5.0',
              'Accept': 'application/vnd.github.v3+json'
          }
          if token:
              headers['Authorization'] = f'token {token}'

          def get_stars(repo):
              try:
                  url = f'https://api.github.com/repos/{repo.strip()}'
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, timeout=10) as resp:
                      data = json.loads(resp.read().decode())
                      stars = data.get('stargazers_count', 0)
                      print(f"[SUCCESS] {repo} -> {stars} stars")
                      return stars
              except Exception as e:
                  print(f"[WARN] Could not fetch {repo}: {e}")
                  return 0

          # 4 组需要合并计算的仓库列表
          pairs = {
              "hvc": ("HVC", ["PGSmall/HVC", "NUST-Machine-Intelligence-Laboratory/HVC"]),
              "hfan": ("HFAN", ["NUST-Machine-Intelligence-Laboratory/HFAN", "CODE4UVOS/HFAN"]),
              "videomac": ("VideoMAC", ["NUST-Machine-Intelligence-Laboratory/VideoMAC", "Video-MAC/VideoMAC"]),
              "clip_pgs": ("CLIP-PGS", ["NUST-Machine-Intelligence-Laboratory/clip-pgs", "PGSmall/clip-pgs"])
          }

          for key, (label, repos) in pairs.items():
              total = sum(get_stars(r) for r in repos)
              badge_data = {
                  "schemaVersion": 1,
                  "label": label,
                  "message": f"★ {total}",
                  "color": "b58900",
                  "labelColor": "002b36"
              }
              with open(f'dist/badges/{key}.json', 'w', encoding='utf-8') as f:
                  json.dump(badge_data, f)
              print(f"==> Total for {label}: {total}")
          EOF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 3. 部署并推送到 output 分支
      - name: Deploy to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          force_orphan: true
